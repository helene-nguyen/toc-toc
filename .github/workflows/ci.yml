name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    # real PostgreSQL for the integration tests — same credentials and port
    # as the local docker-compose, so the db.ts defaults work unchanged
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toctoc
          POSTGRES_PASSWORD: toctoc
          POSTGRES_DB: toctoc
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  #~ The Raspberry Pi image (arm64), published on GitHub's registry after
  # every green push to main — the Pi only pulls it
  image:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/toc-toc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
